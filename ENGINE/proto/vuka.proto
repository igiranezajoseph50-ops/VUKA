// VUKA Bridge gRPC contract.
//
// This is the single source of truth for inter-service messaging between the
// Python ISO 20022 gateway (client) and the Go core engine (server). The Go
// ledger engine is the authority: every RPC maps 1:1 to a ledger.Service
// method, so the gateway never mutates state itself.
//
// Identifiers that are UUIDs in the domain travel as plain strings here (we
// avoid java-style wrappers). Money amounts are carried as double but rounded
// to 4 decimal places (matching NUMERIC(18,4)) by the engine before write.
syntax = "proto3";

package vuka.v1;

option go_package = "vuka/go-bridge-core/internal/grpcpb;grpcpb";

// Bridge exposes the operations the ISO 20022 gateway needs. Cross-border
// transfers (RWF -> KES) are idempotent and write two balanced FX legs.
service Bridge {
  // CreateUser registers a trader and their PERSONAL + BUSINESS wallets.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  // GetBalance returns the derived balance for an account.
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  // FundAccount credits an external cash-in to an account (idempotent).
  rpc FundAccount(FundAccountRequest) returns (TransferResponse);
  // Transfer moves value between two SAME-currency accounts (idempotent).
  rpc Transfer(TransferRequest) returns (TransferResponse);
  // CrossBorderTransfer moves value RWF -> KES through FX settlement legs.
  rpc CrossBorderTransfer(CrossBorderRequest) returns (TransferResponse);
  // GetTransfer fetches a transfer by id. Returns NOT_FOUND if unknown.
  rpc GetTransfer(GetTransferRequest) returns (TransferResponse);
  // ReverseTransfer reverses a SUCCESS transfer (idempotent replay-safe).
  rpc ReverseTransfer(ReverseRequest) returns (TransferResponse);
}

message CreateUserRequest {
  string full_name         = 1;
  string phone_number      = 2;
  string business_reg_number = 3;
  string currency          = 4; // default "RWF"
}

message CreateUserResponse {
  User user = 1;
  repeated Account accounts = 2;
}

message User {
  string id = 1;
  string full_name = 2;
  string phone_number = 3;
  string business_reg_number = 4;
  string kyc_status = 5;
  string created_at = 6; // RFC3339
}

message Account {
  string id = 1;
  string user_id = 2;
  string type = 3;      // PERSONAL | BUSINESS | SETTLEMENT | FEES
  string currency = 4;
  string created_at = 5;
}

message GetBalanceRequest {
  string account_id = 1;
}

message GetBalanceResponse {
  string account_id = 1;
  string type = 2;
  string currency = 3;
  double amount = 4;
}

message FundAccountRequest {
  string account_id = 1;
  string idempotency_key = 2; // UUIDv4
  double amount = 3;
  string currency = 4;
  string reference = 5;
}

message TransferRequest {
  string idempotency_key = 1; // UUIDv4
  string source_account_id = 2;
  string destination_account_id = 3;
  double amount = 4;
  string currency = 5;
  string invoice_number = 6;
}

message CrossBorderRequest {
  string idempotency_key = 1; // UUIDv4
  string source_account_id = 2;   // RWF BUSINESS wallet (Rwanda importer)
  string destination_account_id = 3; // KES BUSINESS wallet (Kenya supplier)
  double amount = 4;               // in currency_from (RWF)
  string currency_from = 5;        // default "RWF"
  string currency_to = 6;          // default "KES"
  double fx_rate = 7;              // optional; engine falls back to env default
  string invoice_number = 8;
}

message GetTransferRequest {
  string transfer_id = 1;
}

message ReverseRequest {
  string transfer_id = 1;
  string reason = 2;
}

message TransferResponse {
  string id = 1;
  string idempotency_key = 2;
  string invoice_number = 3;
  string source_account_id = 4;
  string destination_account_id = 5;
  double amount = 6;
  string currency = 7;     // currency of the source leg / request
  string status = 8;       // SUCCESS | FAILED | REVERSED | ...
  double fx_rate = 9;      // 0 for same-currency transfers
  string external_reference = 10;
  string failure_reason = 11;
  string created_at = 12;
  string updated_at = 13;
  bool replayed = 14;      // true when the idempotency key was replayed
}