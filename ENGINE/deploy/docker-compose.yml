# ============================================================================
# VUKA Phase 1 — Local Development Infrastructure
# PostgreSQL 16 (double-entry ledger) + Adminer (quick DB inspection)
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: vuka-postgres
    environment:
      POSTGRES_USER: vuka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — see ENGINE/deploy/.env.example}
      POSTGRES_DB: vuka
    ports:
      - "5433:5432"            # host 5433 to avoid clashing with any local PG on 5432
    volumes:
      - vuka_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vuka -d vuka"]
      interval: 3s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:latest
    container_name: vuka-adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"

volumes:
  vuka_pgdata:
